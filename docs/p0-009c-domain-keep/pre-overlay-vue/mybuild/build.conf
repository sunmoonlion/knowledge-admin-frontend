# Admin CSR 镜像构建配置

# 镜像名称和标签
ADMIN_CSR_IMAGE="knowledge-admin-frontend"
ADMIN_CSR_TAG="1.0.0"   # 本地固定版本；CI 构建使用 git SHA，由 Kaniko --destination 传入

# 源代码路径（相对于项目根目录）
SOURCE_DIR="."

# 构建选项
DOCKERFILE="Dockerfile"
BUILD_CONTEXT="."

# 容器运行时选择（docker 或 sudo nerdctl）
CONTAINER_RUNTIME="docker"

# nerdctl 命名空间（仅 CONTAINER_RUNTIME 为 nerdctl 时生效）
NERDCTL_NAMESPACE="k8s.io"

# 镜像仓库配置
ADMIN_CSR_IMAGE_REGISTRY="${ADMIN_CSR_IMAGE_REGISTRY:-harbor.sunmoonai.com}"
ADMIN_CSR_IMAGE_PROJECT="${ADMIN_CSR_IMAGE_PROJECT:-app-images}"
REGISTRY="${REGISTRY:-harbor.sunmoonai.com:30443/k8s-images}"   # 传给 Dockerfile --build-arg REGISTRY，用于基础镜像拉取

# 是否在构建后自动推送镜像
PUSH_IMAGES_AFTER_BUILD="${PUSH_IMAGES_AFTER_BUILD:-false}"
